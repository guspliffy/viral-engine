# Every episode storyboard a pull request changes is laid out (render.mjs --layout, no frames drawn, 3-7 minutes each)
# and judged by qa/preflight.mjs --quick: the contact gate, the drawn rig, the must-see list and the front of the
# frame, the motion checks. A storyboard the render would refuse turns the pull request red here, before anyone renders
# it (quality plan item 19). The regress fixtures have their own workflow (contacts.yml).
name: Episode preflight
on:
  pull_request:
    paths:
      - "storyboards/**.json"
      - "qa/preflight.mjs"
      - ".github/workflows/episodes.yml"
  workflow_dispatch:
    inputs:
      storyboards:
        description: "Storyboards to check, space-separated (default: the ones the pull request changes)"
        required: false
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        shell: bash
        env:
          BASE: ${{ github.base_ref || 'main' }}
          GIVEN: ${{ inputs.storyboards }}
        run: |
          if [ -n "$GIVEN" ]; then files="$GIVEN"
          else files=$(git diff --name-only --diff-filter=AM "origin/$BASE...HEAD" -- 'storyboards/*.json' | grep -v -E '^storyboards/(regress|templates)/' || true)
          fi
          # episodes only: a storyboard with a cast (not a set, a grip table or a sound list), and not a tool: a storyboard
          # with "tool" (its reason) is never a video, e.g. a voice probe that only makes and measures the line takes
          # (Potato Desk 05, 18 Nov 2026: the probe's cast, standing in a row, failed this job's preflight)
          keep=""; for f in $files; do [ -f "$f" ] && node -e "const j=require('./'+process.argv[1]); process.exit(Array.isArray(j.cast)&&j.cast.length&&!j.tool?0:1)" "$f" && keep="$keep $f"; done
          # castless storyboards that are still video (a film's narrator-only part, Atlantis B3: no cast, a "voice" on
          # each line) get their sound mixed from a cold voice cache instead (qa/mixcheck.mjs, seconds): the layout has
          # nobody to judge, but the mix crashed there (engine audit, 24 Nov 2026). Sets, grip tables and sound lists
          # have no beats or actions and stay out.
          mix=""; for f in $files; do [ -f "$f" ] && node -e "const j=require('./'+process.argv[1]); const n=(a)=>Array.isArray(a)&&a.length; process.exit(!n(j.cast)&&!j.tool&&(n(j.beats)||n(j.actions))?0:1)" "$f" && mix="$mix $f"; done
          echo "files=$keep" >> "$GITHUB_OUTPUT"
          echo "mix=$mix" >> "$GITHUB_OUTPUT"
          echo "episode storyboards: ${keep:-none}; castless, sound only: ${mix:-none}"
      - if: steps.list.outputs.files != '' || steps.list.outputs.mix != ''
        uses: ./.github/actions/setup
      - if: steps.list.outputs.mix != ''
        name: Mix the sound of each castless storyboard
        run: node qa/mixcheck.mjs ${{ steps.list.outputs.mix }}
      - if: steps.list.outputs.files != ''
        name: Lay out and judge each storyboard
        shell: bash
        run: |
          status=0
          for f in ${{ steps.list.outputs.files }}; do
            echo "::group::$f"
            node qa/preflight.mjs "$f" --quick --fresh | tee -a preflight.txt || status=1
            echo "::endgroup::"
          done
          { echo '```'; cat preflight.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
