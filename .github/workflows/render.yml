# Renders one storyboard on free GitHub runners (the repo is public, so minutes are free): the clip is cut into
# frame ranges, each drawn on its own 4-core machine at the same time, then joined and given its sound.
#
# Start it from the Actions tab (Render a clip -> Run workflow) or: gh workflow run render.yml -f storyboard=... -f flags="--draft"
# The MP4, its cover and the check result are under the run's Artifacts for 3 days. Jonny OK'd (28 Oct 2026) that
# anyone with a GitHub account can download them while they are kept.
name: Render a clip
run-name: "Render ${{ inputs.storyboard }} ${{ inputs.flags }}"
on:
  workflow_dispatch:
    inputs:
      storyboard:
        description: "Storyboard, e.g. storyboards/elevator/fart-elevator.json"
        required: true
      shards:
        description: "Machines to split the clip over (1-20; about 1 per second of clip)"
        default: "16"
      flags:
        description: "Extra render flags, e.g. --draft, --look anime-pro, --from 0 --to 3"
        default: ""
      balance:
        description: "Split frames by expected cost (blur samples) instead of equal counts"
        default: "true"
permissions:
  contents: read
env:
  SB: ${{ inputs.storyboard }}
  FLAGS: ${{ inputs.flags }}
  BAL: ${{ inputs.balance == 'true' && '--balance' || '' }}
  COST: ${{ inputs.balance == 'true' && '--cost --thin-trace' || '' }}

jobs:
  plan:
    name: Check the storyboard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.split.outputs.list }}
      n: ${{ steps.split.outputs.n }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          voice: "true"
      # Spoken lines from earlier runs on this branch (or on main), so a line is read once and not on every run.
      # 10 Nov 2026: a run with a VoxCPM2 voice spent 6 to 14 minutes in the next step, installing the model and
      # reading the same lines again (81-101 s without one). engine/voice/speech.mjs names a line's files by a hash
      # of its text and recipe, so a kept file is that line; a new or changed line is still read here (and then
      # this run pays the install). A cache can't be changed once written, so each run that read a new line saves
      # its own, and the restore takes the newest.
      - uses: actions/cache/restore@v4
        with:
          path: out/speech
          key: speech-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: speech-
      - id: kept
        run: echo "n=$(ls out/speech 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      # the contact gate once for all shards (they skip it), and real speech into out/speech for all of them
      - name: Contact gate and speech
        run: node engine/render.mjs "$SB" --layout $COST $FLAGS
      - id: read
        if: ${{ !cancelled() }}
        run: echo "n=$(ls out/speech 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && steps.read.outputs.n != steps.kept.outputs.n }}
        uses: actions/cache/save@v4
        with:
          path: out/speech
          key: speech-${{ github.run_id }}-${{ github.run_attempt }}
      - id: split
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          n=$(( SHARDS < 1 ? 1 : SHARDS > 20 ? 20 : SHARDS ))
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "list=$(seq -s, 1 "$n" | sed 's/^/[/;s/$/]/')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            out/speech/
            out/*.layout.json
            out/*.cost.json
          retention-days: 1
          if-no-files-found: ignore

  shard:
    name: Shard ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: out
      - name: Render
        run: |
          echo "cpu: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2) x $(nproc)"
          node engine/render.mjs "$SB" --shard ${{ matrix.shard }}/${{ needs.plan.outputs.n }} --skip-gate $BAL --timing-json out/timing-${{ matrix.shard }}.json $FLAGS
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: |
            out/*.part-*.video.mp4
            out/*.part-*.json
            out/*-cover.png
            out/timing-*.json
          retention-days: 1
          if-no-files-found: error

  stitch:
    name: Join and add sound
    needs: [plan, shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: out
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: out
          merge-multiple: true
      - name: Join
        run: node engine/render.mjs "$SB" --stitch ${{ needs.plan.outputs.n }} $FLAGS
      # the clip is published only after its check passed; a clip that fails goes to clip-failed (with the check
      # output) for diagnosis, so a "clip" artifact always means checked
      - name: qa/check
        shell: bash
        run: |
          clip=$(ls out/*.mp4 | grep -v '\.video\.mp4$' | head -1)
          layout=$(ls out/*.layout.json | head -1)
          node qa/check.mjs "$clip" --sb "$SB" --layout "$layout" | tee out/check.txt
          { echo '```'; cat out/check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: clip
          path: |
            out/*.mp4
            !out/*.video.mp4
            out/*-cover.png
            out/check.txt
          retention-days: 3
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clip-failed
          path: |
            out/*.mp4
            out/*-cover.png
            out/*.part-*.json
            out/check.txt
          retention-days: 3
          if-no-files-found: ignore
