# The rule docs every session reads (CLAUDE.md, docs/rules, docs/templates, qa/REVIEW.md, .claude/agents): each repo
# path they name must exist, CLAUDE.md stays <= 60 lines and docs/STATE.md <= 40 (tools/lint-notes.py, 9 Nov 2026).
# A doc that names a missing tool sends the next director looking for it. Seconds, no browser.
name: Rule docs
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # docs/VOCAB.md is written from the code at session start, not committed: written here too, so the docs that
      # name it pass, and so a change that breaks the sheet (a renamed table in the engine) fails here
      - name: The vocabulary sheet still writes from the code
        run: node tools/vocab.mjs && test "$(grep -c '^- `' docs/VOCAB.md)" -gt 80
      - name: Paths named in the rule docs exist, line caps hold
        run: python3 tools/lint-notes.py docs
