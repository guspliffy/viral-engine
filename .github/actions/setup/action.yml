# Everything a render needs on a fresh GitHub runner: Node packages, the Chromium that playwright-core expects
# (cached), ffmpeg, and with voice: true the Kokoro voice model (cached, ~350 MB) for real speech.
name: Set up the engine
description: Node packages, Chromium, ffmpeg and (optionally) the voice model
inputs:
  voice:
    description: Also set up the voice model (engine/voice/setup.mjs)
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - shell: bash
      run: npm ci --no-audit --no-fund
    - id: pw
      shell: bash
      run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
    - shell: bash
      run: npx playwright-core install chromium
    # ffmpeg from Ubuntu: apt-get update + install takes over a minute, so the .deb files are cached per runner image
    # and installed straight from the cache (seconds) on later runs
    - uses: actions/cache@v4
      with:
        path: ~/ffmpeg-debs
        key: ffmpeg-debs-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}
    - shell: bash
      run: |
        if ls ~/ffmpeg-debs/*.deb > /dev/null 2>&1; then
          sudo dpkg -i --force-depends ~/ffmpeg-debs/*.deb > /dev/null
        else
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends --download-only ffmpeg > /dev/null
          mkdir -p ~/ffmpeg-debs && cp /var/cache/apt/archives/*.deb ~/ffmpeg-debs/
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
        fi
        ffmpeg -version | head -1
    # Xvfb and Mesa for the default renderer (render.mjs --gl llvmpipe); GitHub's Ubuntu runners already have them
    - shell: bash
      run: command -v Xvfb > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb libgl1-mesa-dri > /dev/null)
    - if: inputs.voice == 'true'
      uses: actions/cache@v4
      with:
        path: |
          engine/voice/.venv
          engine/voice/models
        key: voice-${{ runner.os }}-${{ hashFiles('engine/voice/requirements.txt', 'engine/voice/setup.mjs') }}
    - if: inputs.voice == 'true'
      shell: bash
      run: node engine/voice/setup.mjs
